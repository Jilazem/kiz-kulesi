<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';

const hatalar = [];
window.addEventListener('error', (e) => hatalar.push(String(e.message)));
window.addEventListener('unhandledrejection', (e) => hatalar.push('promise: ' + String(e.reason)));

const DUSUK = window.matchMedia('(max-width: 760px)').matches && navigator.maxTouchPoints > 0;
let kalite = DUSUK ? 'dusuk' : 'yuksek';

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.info.autoReset = false;
renderer.setPixelRatio(Math.min(devicePixelRatio, kalite === 'dusuk' ? 1 : 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.16;
renderer.shadowMap.enabled = kalite !== 'dusuk';
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOG_HEX = 0xb98a70;
const fogColor = new THREE.Color(FOG_HEX);
scene.fog = new THREE.FogExp2(FOG_HEX, 0.00017);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.5, 22000);
camera.position.set(62, 15, 78);

const SUN_DIR = new THREE.Vector3(-0.46, 0.135, -0.88).normalize();

// ---------- sky ----------
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uTime: { value: 0 }, uSunDir: { value: SUN_DIR } },
  vertexShader: `
    varying vec3 vDir;
    void main(){
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uSunDir;
    varying vec3 vDir;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float vnoise(vec2 p){
      vec2 i = floor(p); vec2 f = fract(p);
      f = f*f*(3.0-2.0*f);
      float a = hash(i), b = hash(i+vec2(1.0,0.0)), c = hash(i+vec2(0.0,1.0)), d = hash(i+vec2(1.0,1.0));
      return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
    }
    float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*vnoise(p); p*=2.07; a*=0.5; } return v; }
    void main(){
      vec3 d = normalize(vDir);
      float h = clamp(d.y, 0.0, 1.0);
      vec3 zen = vec3(0.028,0.065,0.175);
      vec3 mid = vec3(0.26,0.16,0.20);
      vec3 hor = vec3(0.95,0.44,0.19);
      vec3 col = mix(hor, mid, smoothstep(0.0,0.13,h));
      col = mix(col, zen, smoothstep(0.10,0.55,h));
      float sd = max(dot(d, uSunDir), 0.0);
      col += vec3(1.35,0.72,0.34) * pow(sd, 9.0) * 0.55;
      col += vec3(2.6,1.45,0.72) * pow(sd, 320.0) * 0.9;
      col += vec3(26.0,16.0,7.5) * smoothstep(0.99925, 0.99970, sd);
      if(d.y > 0.01){
        vec2 cuv = d.xz / (d.y + 0.09) * 0.30;
        cuv += vec2(uTime*0.0035, uTime*0.0016);
        float c = fbm(cuv*1.25);
        float c2 = fbm(cuv*3.4 + 11.7);
        float clouds = smoothstep(0.46, 0.86, c*0.78 + c2*0.42);
        vec3 cl = mix(vec3(0.30,0.17,0.17), vec3(1.65,0.92,0.52), pow(max(dot(normalize(vec3(d.x,0.45,d.z)), uSunDir),0.0), 2.0));
        col = mix(col, cl, clouds * smoothstep(0.01,0.12,d.y) * 0.88);
      }
      col = mix(vec3(0.62,0.34,0.22), col, smoothstep(-0.12, 0.02, d.y));
      gl_FragColor = vec4(col, 1.0);
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(14000, 48, 32), skyMat);
sky.frustumCulled = false;
scene.add(sky);

// ---------- ocean (Gerstner) ----------
const OCEAN_SIZE = 11000;
const oceanUniforms = {
  uTime: { value: 0 },
  uDetail: { value: kalite === 'dusuk' ? 0 : 1 },
  uSunDir: { value: SUN_DIR },
  uCamPos: { value: camera.position },
  uFogColor: { value: new THREE.Vector3(fogColor.r, fogColor.g, fogColor.b) },
  uFogDensity: { value: 0.00017 }
};

const oceanVertex = `
uniform float uTime; uniform float uDetail;
varying vec3 vWPos; varying vec3 vNrm; varying float vCrest; varying float vSteep;
float hsh(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
float vnz(vec2 p){
  vec2 i = floor(p); vec2 f = fract(p); f = f*f*(3.0-2.0*f);
  float a = hsh(i), b = hsh(i+vec2(1.0,0.0)), c = hsh(i+vec2(0.0,1.0)), d = hsh(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
void dalga(inout vec3 d, inout vec3 tx, inout vec3 tz, inout float cr, inout float st,
           vec2 p, vec2 dir, float A, float L, float Q, float sp, float t){
  float k = 6.2831853 / L;
  float f = k * dot(dir, p) - sp * t;
  float c = cos(f); float s = sin(f);
  d.x += Q*A*dir.x*c;
  d.z += Q*A*dir.y*c;
  d.y += A*s;
  tx += vec3(-Q*A*k*dir.x*dir.x*s, A*k*dir.x*c, -Q*A*k*dir.x*dir.y*s);
  tz += vec3(-Q*A*k*dir.x*dir.y*s, A*k*dir.y*c, -Q*A*k*dir.y*dir.y*s);
  cr += A*s;
  st += A*k*abs(s)*0.62;
}
void main(){
  vec2 p = position.xz;
  // iki ölçekli alan bükümü: dalga cepheleri düzensizleşir, tekrar eden ızgara hissi kırılır
  float wA = vnz(p*0.0031 + vec2(uTime*0.0037, 3.1));
  float wB = vnz(p*0.0024 - vec2(1.7, uTime*0.0031));
  vec2 wp = p + vec2(wA - 0.5, wB - 0.5) * 30.0
            + vec2(sin(p.y*0.0087 + 1.3 + uTime*0.021), cos(p.x*0.0071 - 0.6 - uTime*0.017)) * 8.0;
  // bileşen genlikleri düşük frekanslı gürültüyle modüle: eşit dalga treni yok
  float mA = 0.62 + 0.62 * vnz(wp*0.0042 + 11.0);
  float mB = 0.58 + 0.72 * vnz(wp*0.0051 - 4.0);
  float mC = 0.55 + 0.80 * vnz(wp*0.0063 + 21.0);
  float mD = 0.50 + 0.85 * vnz(wp*0.0088 - 13.0);
  vec3 d = vec3(0.0);
  vec3 tx = vec3(1.0,0.0,0.0);
  vec3 tz = vec3(0.0,0.0,1.0);
  float cr = 0.0, st = 0.0;
  // uzun swell + ikinci swell, farklı yönlerde
  dalga(d,tx,tz,cr,st,wp, normalize(vec2(0.94,0.34)), 1.28*mA, 118.0, 0.55, 4.0, uTime);
  dalga(d,tx,tz,cr,st,wp, normalize(vec2(0.52,-0.86)), 0.86*mB, 74.0, 0.62, 5.2, uTime);
  // kısa rüzgar dalgaları
  dalga(d,tx,tz,cr,st,wp, normalize(vec2(-0.33,0.94)), 0.44*mC, 41.0, 0.72, 6.6, uTime);
  dalga(d,tx,tz,cr,st,wp, normalize(vec2(0.88,0.47)), 0.26*mD, 23.0, 0.82, 7.8, uTime);
  if(uDetail > 0.5){
    dalga(d,tx,tz,cr,st,wp, normalize(vec2(-0.74,0.67)), 0.15, 13.0, 0.90, 8.8, uTime);
    dalga(d,tx,tz,cr,st,wp, normalize(vec2(0.25,-0.97)), 0.08, 7.2, 1.0, 9.6, uTime);
  }
  vec3 pos = position + d;
  vec3 n = normalize(cross(tz, tx));
  vWPos = (modelMatrix * vec4(pos, 1.0)).xyz;
  vNrm = n;
  vCrest = cr;
  vSteep = st;
  gl_Position = projectionMatrix * viewMatrix * vec4(vWPos, 1.0);
}`;

const oceanFragment = `
uniform float uTime; uniform vec3 uSunDir; uniform vec3 uCamPos;
uniform vec3 uFogColor; uniform float uFogDensity;
varying vec3 vWPos; varying vec3 vNrm; varying float vCrest; varying float vSteep;
float hsh(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
float vnz(vec2 p){
  vec2 i = floor(p); vec2 f = fract(p);
  f = f*f*(3.0-2.0*f);
  float a = hsh(i), b = hsh(i+vec2(1.0,0.0)), c = hsh(i+vec2(0.0,1.0)), d = hsh(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){ v+=a*vnz(p); p*=2.05; a*=0.5; } return v; }
vec2 grad2(vec2 p){ float e = 0.42; float a = vnz(p); return vec2(vnz(p+vec2(e,0.0))-a, vnz(p+vec2(0.0,e))-a) / e; }
vec3 gokyuzu(vec3 d){
  float h = clamp(d.y, 0.0, 1.0);
  vec3 zen = vec3(0.028,0.065,0.175);
  vec3 mid = vec3(0.26,0.16,0.20);
  vec3 hor = vec3(0.95,0.44,0.19);
  vec3 col = mix(hor, mid, smoothstep(0.0,0.13,h));
  col = mix(col, zen, smoothstep(0.10,0.55,h));
  float sd = max(dot(d, uSunDir), 0.0);
  col += vec3(1.35,0.72,0.34) * pow(sd, 9.0) * 0.55;
  col += vec3(2.6,1.45,0.72) * pow(sd, 320.0) * 0.55;
  return col;
}
void main(){
  vec3 V = normalize(uCamPos - vWPos);
  vec3 N = normalize(vNrm);
  float dist = length(uCamPos - vWPos);
  vec2 rp = vWPos.xz;
  // akıntı yönü: köpük izleri ve parıltı bu eksende uzar
  vec2 cur = normalize(vec2(0.86, 0.51));
  vec2 curP = vec2(-cur.y, cur.x);
  vec2 aniso = vec2(dot(rp, cur), dot(rp, curP));
  float t = uTime;
  // ripple örnekleme sönümü: uzakta ve sıyıran bakışta ayrıntı düşer (moiré önlemi)
  float rFade = 1.0 - smoothstep(35.0, 260.0, dist);
  rFade *= smoothstep(0.03, 0.20, abs(dot(N, V)));
  // ince ripple: akıntı boyunca uzun rüzgar çizgileri + orta kırışıklık + kapiler
  vec2 g1 = grad2(aniso * vec2(0.16, 0.85) + vec2(t*0.12, t*0.38));
  vec2 g2 = grad2(rp * 1.25 + vec2(t*0.52, -t*0.47));
  vec2 g3 = grad2(rp * 4.4 + vec2(-t*0.95, t*0.72));
  vec2 rip = (g1*0.42 + g2*0.34 + g3*0.24) * rFade;
  N = normalize(N + vec3(rip.x, 0.0, rip.y) * 0.09);
  float fres = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 5.0);
  fres = clamp(0.02 + fres * 0.98, 0.0, 1.0);
  vec3 R = reflect(-V, N);
  R.y = abs(R.y);
  // kırılma benzeri hafif distorsiyon: yansıma örneklemi zamanla kayar
  vec2 dref = vec2(vnz(rp*0.85 + t*0.19), vnz(rp*0.85 - t*0.15)) - 0.5;
  vec3 R2 = normalize(R + vec3(dref.x*0.045, 0.0, dref.y*0.045));
  vec3 refl = mix(gokyuzu(R), gokyuzu(R2), 0.5);

  float dd = length(vWPos.xz);
  // derinlik renk geçişi: kule dibinde koyu turkuaz, açıkta lacivert
  vec3 dibi = vec3(0.012, 0.090, 0.094);
  vec3 ara = vec3(0.014, 0.048, 0.092);
  vec3 acik = vec3(0.009, 0.026, 0.070);
  vec3 water = mix(dibi, ara, smoothstep(16.0, 110.0, dd));
  water = mix(water, acik, smoothstep(110.0, 1500.0, dd));
  water *= 1.0 - 0.42 * smoothstep(500.0, 3200.0, dd);

  // güneş yolu hizası
  float sunAz = pow(max(dot(normalize(vec3(R.x, 0.0, R.z) + vec3(1e-5)), normalize(vec3(uSunDir.x, 0.0, uSunDir.z))), 0.0), 7.0);
  vec3 H = normalize(uSunDir + V);
  float nh = max(dot(N, H), 0.0);
  // parıltı: akıntıya dik ince, zamanla kayan çizgiler — tekrar eden leke yok
  float gl1 = vnz(vec2(aniso.x*1.7, aniso.y*8.5) + vec2(t*0.85, -t*0.31));
  float gl2 = vnz(vec2(aniso.x*3.9, aniso.y*17.0) - vec2(t*1.55, t*0.66));
  float sparkle = smoothstep(0.52, 0.94, gl1*0.62 + gl2*0.52);
  float spec = pow(nh, 110.0) * (0.5 + 1.9 * sunAz) + pow(nh, 1400.0) * (1.8 + 5.0 * sunAz);
  spec *= (0.14 + 0.85 * sunAz) * (0.30 + 1.10 * sparkle);
  vec3 sunCol = vec3(1.9, 1.12, 0.58);

  vec3 col = mix(water, refl, fres * 0.50);
  float road = sunAz * smoothstep(18.0, 220.0, dist) * (0.22 + 0.78 * sparkle);
  col += vec3(1.45, 0.86, 0.46) * road * 0.26;
  col += sunCol * spec;

  // kule gölgesi suya düşer: güneşin tersi yönde, gürültüyle dağılan koyu leke
  vec2 shDir = normalize(vec2(-uSunDir.x, -uSunDir.z));
  vec2 shP = vec2(-shDir.y, shDir.x);
  float shAlong = dot(rp, shDir);
  float shAcross = dot(rp, shP);
  float shM = smoothstep(-1.0, 7.0, shAlong) * (1.0 - smoothstep(26.0, 92.0, shAlong));
  shM *= 1.0 - smoothstep(2.5, 13.0, abs(shAcross));
  shM *= 0.72 + 0.28 * vnz(rp*0.30 + 4.0);
  col *= 1.0 - 0.46 * shM;

  // köpük: yalnız dalga tepeleri, kırılma çizgisi ve kaide teması
  float crestH = smoothstep(0.55, 1.40, vCrest);
  float slope = smoothstep(0.45, 1.05, vSteep);
  float blob = fbm(rp*0.20 + vec2(t*0.10, -t*0.07));
  float grain = vnz(aniso*vec2(1.1, 3.4) + vec2(t*0.62, -t*0.38));
  float foam = crestH * slope * (0.20 + 0.80 * smoothstep(0.40, 0.80, blob));
  // kırılma çizgisi: cephe tepesinin hemen altında, gürültüyle parçalanmış ince bant
  float brk = smoothstep(0.55, 0.78, vCrest) * (1.0 - smoothstep(0.85, 1.30, vCrest));
  brk *= smoothstep(0.50, 0.98, vSteep) * smoothstep(0.30, 0.78, blob*0.62 + grain*0.52);
  foam = max(foam, brk * 0.62 * (0.35 + 0.65 * grain));
  // kaide teması: kare platform çevresinde, akıntı yönünde uzayan düzensiz parmaklar
  float sq = max(abs(vWPos.x), abs(vWPos.z)) - 12.0;
  float contact = (1.0 - smoothstep(1.2, 9.5, sq)) * smoothstep(-2.0, 0.1, sq);
  float tr1 = vnz(vec2(aniso.x*0.80 - t*0.55, aniso.y*0.30));
  float tr2 = vnz(vec2(aniso.x*0.24 - t*0.22, aniso.y*0.85) + 3.0);
  float fingers = smoothstep(0.40, 0.78, tr1*0.66 + tr2*0.52);
  float surge = 0.5 + 0.5 * sin(t*1.35);
  foam += contact * fingers * (0.50 + 0.50 * surge) * (0.55 + 0.45 * smoothstep(0.1, 0.9, crestH));
  foam = clamp(foam, 0.0, 1.0);

  float bubbles = smoothstep(0.50, 0.94, fbm(aniso*vec2(2.6, 5.2) + vec2(t*0.3, -t*0.2)));
  vec3 foamCol = mix(vec3(0.44, 0.51, 0.58), vec3(0.88, 0.90, 0.92), bubbles);
  foamCol *= 0.74 + 0.26 * max(dot(N, uSunDir), 0.0);
  col = mix(col, foamCol, foam*0.92);

  float fogF = 1.0 - exp(-uFogDensity*uFogDensity*dist*dist);
  col = mix(col, uFogColor, clamp(fogF, 0.0, 1.0));
  gl_FragColor = vec4(col, 1.0);
}`;

const oceanMat = new THREE.ShaderMaterial({
  uniforms: oceanUniforms, vertexShader: oceanVertex, fragmentShader: oceanFragment,
  side: THREE.DoubleSide
});

let oceanSeg = kalite === 'dusuk' ? 96 : 256;
let ocean;
// Kutupsal LOD ızgara: kule çevresinde yoğun, ufukta seyrek — dalga detayı gerçekten örneklenir
function buildOcean(seg) {
  if (ocean) { scene.remove(ocean); ocean.geometry.dispose(); }
  const rings = kalite === 'dusuk' ? 150 : 250;
  const R = 12000, r0 = 1.1;
  const ratio = Math.pow(R / r0, 1 / (rings - 1));
  const pos = new Float32Array(rings * seg * 3);
  const idx = [];
  let p = 0;
  for (let i = 0; i < rings; i++) {
    const r = r0 * Math.pow(ratio, i);
    for (let j = 0; j < seg; j++) {
      const a = (j / seg) * Math.PI * 2;
      pos[p++] = Math.cos(a) * r; pos[p++] = 0; pos[p++] = Math.sin(a) * r;
    }
  }
  for (let i = 0; i < rings - 1; i++) {
    for (let j = 0; j < seg; j++) {
      const j2 = (j + 1) % seg;
      const a = i * seg + j, b = i * seg + j2, c = (i + 1) * seg + j, d = (i + 1) * seg + j2;
      idx.push(a, c, b, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), R);
  ocean = new THREE.Mesh(g, oceanMat);
  ocean.frustumCulled = false;
  scene.add(ocean);
}

// ---------- textures ----------
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ---- prosedürel gürültü yardımcıları ----
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return (a * (1 - ux) + b * ux) * (1 - uy) + (c * (1 - ux) + d * ux) * uy;
}
function fbm2(x, y, oct) {
  let v = 0, a = 0.5;
  for (let i = 0; i < (oct || 4); i++) { v += a * vnoise2(x, y); x *= 2.07; y *= 2.07; a *= 0.5; }
  return v;
}

// yükseklik alanından gerçek normal haritası (derzler çukur olur)
function heightToNormal(H, S, strength) {
  const c = makeCanvas(S, S), x = c.getContext('2d');
  const img = x.createImageData(S, S), d = img.data;
  for (let y = 0; y < S; y++) {
    for (let xx = 0; xx < S; xx++) {
      const i = y * S + xx;
      const l = H[y * S + ((xx - 1 + S) % S)], r = H[y * S + ((xx + 1) % S)];
      const u = H[((y - 1 + S) % S) * S + xx], dn = H[((y + 1) % S) * S + xx];
      const nx = (l - r) * strength, ny = (u - dn) * strength, nz = 1.0;
      const len = Math.hypot(nx, ny, nz), o = i * 4;
      d[o] = (nx / len * 0.5 + 0.5) * 255;
      d[o + 1] = (ny / len * 0.5 + 0.5) * 255;
      d[o + 2] = (nz / len * 0.5 + 0.5) * 255;
      d[o + 3] = 255;
    }
  }
  x.putImageData(img, 0, 0);
  return c;
}

// çok ölçekli taş: iri blok + ince gren + düşük frekans akıntı/leke (albedo, normal, roughness)
function stoneMaps(S) {
  const alb = makeCanvas(S, S), rgh = makeCanvas(S, S);
  const ax = alb.getContext('2d'), rx = rgh.getContext('2d');
  const ai = ax.createImageData(S, S), ri = rx.createImageData(S, S);
  const ad = ai.data, rd = ri.data;
  const H = new Float32Array(S * S);
  const rows = 8, cols = 4, bh = S / rows, bw = S / cols;
  const tone = [], mossy = [];
  for (let r = 0; r < rows; r++) {
    tone.push([]); mossy.push([]);
    for (let k = 0; k < cols; k++) { tone[r].push(0.8 + Math.random() * 0.32); mossy[r].push(Math.random()); }
  }
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const row = Math.floor(y / bh);
      const off = (row % 2) * bw * 0.5;
      const xr = (x + off) % S;
      const col = Math.floor(xr / bw);
      const fx = (xr % bw) / bw, fy = (y % bh) / bh;
      const joint = Math.min(Math.min(fx, 1 - fx) * bw, Math.min(fy, 1 - fy) * bh);
      const jt = Math.max(0, 1 - joint / 5.0);
      const grain = fbm2(x * 0.085, y * 0.085, 4);
      const fine = fbm2(x * 0.62, y * 0.62, 3);
      const streak = fbm2(x * 0.012, y * 0.05, 3);
      const blotch = fbm2(x * 0.006, y * 0.006, 4);
      const h = 0.55 - jt * 0.40 + (tone[row][col] - 0.96) * 0.08
        + (grain - 0.5) * 0.17 + (fine - 0.5) * 0.07 - Math.max(0, streak - 0.55) * 0.10;
      H[y * S + x] = h;
      let base = 130 + (tone[row][col] - 0.96) * 92 + (grain - 0.5) * 48 + (fine - 0.5) * 28;
      base -= jt * 54;
      base -= Math.max(0, streak - 0.5) * 62;
      base -= Math.max(0, blotch - 0.64) * 46;
      const moss = Math.max(0, streak - 0.58) * 1.7 + Math.max(0, blotch - 0.7) * 1.2;
      const o = (y * S + x) * 4;
      ad[o] = Math.max(0, Math.min(255, base * (0.99 + mossy[row][col] * 0.05)));
      ad[o + 1] = Math.max(0, Math.min(255, base * (0.96 + moss * 0.12)));
      ad[o + 2] = Math.max(0, Math.min(255, base * (0.87 - moss * 0.12)));
      ad[o + 3] = 255;
      let rv = 230 + jt * 22 - Math.max(0, streak - 0.45) * 105 - Math.max(0, blotch - 0.72) * 55;
      rv = Math.max(62, Math.min(255, rv));
      rd[o] = rv; rd[o + 1] = rv; rd[o + 2] = rv; rd[o + 3] = 255;
    }
  }
  ax.putImageData(ai, 0, 0); rx.putImageData(ri, 0, 0);
  return { alb, nrm: heightToNormal(H, S, 5.5), rgh };
}

// kurşun kaplama: dikey dikişler, hafif oksit yeşili lekeler
function leadMaps(S) {
  const alb = makeCanvas(S, S), rgh = makeCanvas(S, S);
  const ax = alb.getContext('2d'), rx = rgh.getContext('2d');
  const ai = ax.createImageData(S, S), ri = rx.createImageData(S, S);
  const ad = ai.data, rd = ri.data;
  const H = new Float32Array(S * S);
  const seam = 26;
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const sx = x % seam, seamD = Math.min(sx, seam - sx);
      const jt = Math.max(0, 1 - seamD / 2.4);
      const n = fbm2(x * 0.05, y * 0.05, 3);
      const fine = fbm2(x * 0.45, y * 0.45, 2);
      const ox = fbm2(x * 0.008 + 4.0, y * 0.02, 4);
      const streak = fbm2(x * 0.01, y * 0.06 + 7.0, 3);
      H[y * S + x] = 0.6 - jt * 0.46 + (n - 0.5) * 0.10 + (fine - 0.5) * 0.05;
      let base = 134 + (n - 0.5) * 30 - jt * 48;
      const oxm = Math.max(0, ox - 0.62) * 2.2 + Math.max(0, streak - 0.6) * 1.4;
      const o = (y * S + x) * 4;
      ad[o] = Math.max(0, Math.min(255, base * (1.0 - oxm * 0.32)));
      ad[o + 1] = Math.max(0, Math.min(255, base * (1.0 + oxm * 0.18)));
      ad[o + 2] = Math.max(0, Math.min(255, base * (1.0 - oxm * 0.12)));
      ad[o + 3] = 255;
      let rv = Math.max(50, Math.min(255, 150 + jt * 60 - oxm * 45));
      rd[o] = rv; rd[o + 1] = rv; rd[o + 2] = rv; rd[o + 3] = 255;
    }
  }
  ax.putImageData(ai, 0, 0); rx.putImageData(ri, 0, 0);
  return { alb, nrm: heightToNormal(H, S, 4.2), rgh };
}

function woodTexture() {
  const c = makeCanvas(512, 512), x = c.getContext('2d');
  x.fillStyle = '#6d4a2c'; x.fillRect(0, 0, 512, 512);
  // uzun damarlar

    x.lineWidth = 0.6 + Math.random() * 2.6;
    x.beginPath(); x.moveTo(0, y);
    for (let k = 0; k <= 512; k += 8) x.lineTo(k, y + Math.sin(k * 0.035 + i * 1.7) * (1.6 + (i % 5)) + Math.sin(k * 0.11) * 0.8);
    x.stroke();
  }
  // budaklar
  for (let i = 0; i < 5; i++) {
    const cx = Math.random() * 512, cy = Math.random() * 512, r = 9 + Math.random() * 16;

  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function foamTexture() {

function contactShadowTexture() {
  const c = makeCanvas(256, 256), x = c.getContext('2d');

  gr.addColorStop(0, 'rgba(0,0,0,0.62)');

function texFromCanvas(c, srgb) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = srgb === false ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function flagTexture() {
  const c = makeCanvas(512, 340), x = c.getContext('2d');
  x.fillStyle = '#e30a17'; x.fillRect(0, 0, 512, 340);
  x.fillStyle = '#ffffff';
  x.beginPath(); x.arc(205, 170, 100, 0, 6.283); x.fill();
  x.fillStyle = '#e30a17';
  x.beginPath(); x.arc(242, 170, 80, 0, 6.283); x.fill();
  x.fillStyle = '#ffffff';
  const cx = 352, cy = 170, R = 46, r2 = 18;
  x.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * (Math.PI * 2 / 5);
    const a2 = a + Math.PI / 5;
    x.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    x.lineTo(cx + Math.cos(a2) * r2, cy + Math.sin(a2) * r2);
  }
  x.closePath(); x.fill();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// taş malzemesi: doku ölçeği mesh boyutuna göre; ıslak bant, yosun ve dikey kir dünya konumuna bağlı
function stoneMaterial(opts) {
  const o = opts || {};
  const circ = o.circ || 30, height = o.height || 8;
  const ru = Math.max(1, circ / 4.0), rv = Math.max(1, height / 4.0);
  const map = texFromCanvas(STONE.alb); map.repeat.set(ru, rv);
  const nrm = texFromCanvas(STONE.nrm, false); nrm.repeat.set(ru, rv);
  const rgh = texFromCanvas(STONE.rgh, false); rgh.repeat.set(ru, rv);
  const mat = new THREE.MeshStandardMaterial({
    map, normalMap: nrm, roughnessMap: rgh, normalScale: new THREE.Vector2(1.15, 1.15),
    color: o.color === undefined ? 0xd8cdbd : o.color,
    roughness: o.wet ? 0.58 : 0.95, metalness: o.wet ? 0.06 : 0.02
  });
  const dTex = texFromCanvas(STONE.alb);
  const dNrm = texFromCanvas(STONE.nrm, false);
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uDet = { value: dTex };
    sh.uniforms.uDetN = { value: dNrm };
    sh.uniforms.uWetTop = { value: o.wetTop === undefined ? 1.9 : o.wetTop };
    sh.uniforms.uMossTop = { value: o.mossTop === undefined ? 3.4 : o.mossTop };
    sh.uniforms.uMossAmt = { value: o.moss === false ? 0.0 : (o.mossAmt === undefined ? 0.5 : o.mossAmt) };
    sh.uniforms.uWetAmt = { value: o.wetAmt === undefined ? 0.95 : o.wetAmt };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        #ifdef USE_INSTANCING
          vWPos = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
        #else
          vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
        #endif`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform sampler2D uDet; uniform sampler2D uDetN;
        uniform float uWetTop; uniform float uMossTop; uniform float uMossAmt; uniform float uWetAmt;
        varying vec3 vWPos;
        float shash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
        float svn(vec2 p){ vec2 i=floor(p); vec2 f=fract(p); f=f*f*(3.0-2.0*f);
          float a=shash(i), b=shash(i+vec2(1.0,0.0)), c=shash(i+vec2(0.0,1.0)), d=shash(i+vec2(1.0,1.0));
          return mix(mix(a,b,f.x), mix(c,d,f.x), f.y); }`)
      .replace('#include <map_fragment>', `
        vec2 duv = vMapUv;
        float cs = 0.62, sn = 0.78;
        vec2 ruv = vec2(cs * duv.x - sn * duv.y, sn * duv.x + cs * duv.y) * 2.7;
        vec4 sampledDiffuseColor = texture2D( map, vMapUv );
        vec4 det = texture2D( uDet, ruv );
        sampledDiffuseColor.rgb *= mix( vec3(1.0), det.rgb * 1.55, 0.42 );
        diffuseColor *= sampledDiffuseColor;
        // hava koşulları: dikey kir akıntısı, ıslak su hattı bandı, yosun
        float ang = atan(vWPos.z, vWPos.x);
        float st1 = svn(vec2(ang * 3.4 + vWPos.y * 0.05, vWPos.y * 0.16));
        float st2 = svn(vec2(ang * 9.1 + vWPos.y * 0.02, vWPos.y * 0.42) + 7.0);
        float streak = smoothstep(0.44, 0.86, st1 * 0.62 + st2 * 0.52);
        float wet = 1.0 - smoothstep(uWetTop - 0.7, uWetTop + 1.0, vWPos.y);
        float moss = 1.0 - smoothstep(uMossTop - 0.6, uMossTop + 1.4, vWPos.y);
        moss *= smoothstep(0.34, 0.82, st2 * 0.7 + st1 * 0.45) * uMossAmt;
        diffuseColor.rgb *= mix(1.0, 0.60, streak * 0.62);
        diffuseColor.rgb *= mix(1.0, 0.52, wet * uWetAmt);
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.15, 0.23, 0.14), moss);
      `)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        vec3 dn = texture2D( uDetN, ruv ).xyz * 2.0 - 1.0;
        normal = normalize( normal + vec3( dn.x, 0.0, dn.y ) * 0.55 );
      `)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        float wetR = 1.0 - smoothstep(uWetTop - 0.7, uWetTop + 1.0, vWPos.y);
        float mossR = (1.0 - smoothstep(uMossTop - 0.6, uMossTop + 1.4, vWPos.y)) * uMossAmt;
        roughnessFactor = mix(roughnessFactor, 0.12, wetR * uWetAmt);
        roughnessFactor = mix(roughnessFactor, 0.88, mossR * 0.7);
        roughnessFactor = clamp(roughnessFactor, 0.05, 1.0);
      `);
  };
  mat.customProgramCacheKey = () => 'weatheredStone_v2';
  return mat;
}

    varying vec3 vW; varying vec2 vUv;
    void main() { vUv = uv; vec4 wp = modelMatrix * vec4(position, 1.0); vW = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }

  fragmentShader: `
    uniform float uTime; uniform float uSurge; uniform sampler2D uTex;
    varying vec3 vW; varying vec2 vUv;
    void main() {
      float ang = atan(vW.z, vW.x);
      float hN = clamp(vUv.y, 0.0, 1.0);           // 0 alt, 1 üst
      float n1 = texture2D(uTex, vec2(ang * 2.6 + uTime * 0.05, vUv.y * 1.4 - uTime * 0.42)).r;
      float n2 = texture2D(uTex, vec2(ang * 6.3 - uTime * 0.08, vUv.y * 3.1 - uTime * 0.9)).r;
      float streak = smoothstep(0.18, 0.78, n1 * 0.7 + n2 * 0.55);
      float topFade = smoothstep(1.0, 0.35, hN);

      float surge = 0.35 + 0.65 * uSurge;
      float a = streak * topFade * botFade * surge * 0.55;
      a *= 0.45 + 0.55 * (0.5 + 0.5 * sin(ang * 4.0 + uTime * 1.6));
      gl_FragColor = vec4(0.94, 0.975, 1.0, clamp(a, 0.0, 0.72));
    }
  `
});

  uniforms: { uTime: { value: 0 }, uSurge: { value: 0 }, uTex: { value: foamS } },
  vertexShader: `
    varying vec3 vW;
    void main() { vec4 wp = modelMatrix * vec4(position, 1.0); vW = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }
  `,
  fragmentShader: `
    uniform float uTime; uniform float uSurge; uniform sampler2D uTex;
    varying vec3 vW;
    void main() {
      vec2 p = vW.xz;
      float r = length(p);
      float ang = atan(p.y, p.x);
      float band = smoothstep(19.6, 14.6, r) * smoothstep(11.6, 12.8, r);
      float n1 = texture2D(uTex, vec2(ang * 0.9 + uTime * 0.03, r * 0.028 - uTime * 0.05)).r;

      float blob = smoothstep(0.10, 0.62, n1 * 0.75 + n2 * 0.45);
      float lace = 0.55 + 0.45 * smoothstep(0.05, 0.45, n2);
      float pulse = 0.5 + 0.5 * sin(uTime * 1.5 + ang * 3.0 + r * 0.4);
      float a = band * blob * lace * pulse * (0.30 + 0.42 * uSurge) + band * 0.09 * uSurge;
      gl_FragColor = vec4(0.93, 0.97, 1.0, clamp(a, 0.0, 0.78));

});

composer.addPass(ssaoPass);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.42, 0.45, 1.06);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());
const fxaaPass = new ShaderPass(FXAAShader);
fxaaPass.material.uniforms.resolution.value.set(1 / (innerWidth * renderer.getPixelRatio()), 1 / (innerHeight * renderer.getPixelRatio()));
composer.addPass(fxaaPass);
bloomPass.enabled = kalite !== 'dusuk';
ssaoPass.enabled = kalite !== 'dusuk';

// ---------- controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 13, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 22;
controls.maxDistance = 900;
controls.maxPolarAngle = Math.PI * 0.52;
controls.minPolarAngle = 0.05;
controls.update();

const keys = new Set();
window.addEventListener('keydown', (e) => {
  keys.add(e.code);
  if (e.code === 'KeyF') toggleLock();
  if (e.code === 'Escape') { /* browser handles pointer lock exit */ }
});
window.addEventListener('keyup', (e) => keys.delete(e.code));

let yaw = 0, pitch = 0;
const euler = new THREE.Euler(0, 0, 0, 'YXZ');
function toggleLock() {
  if (document.pointerLockElement === renderer.domElement) document.exitPointerLock();
  else renderer.domElement.requestPointerLock();
}
renderer.domElement.addEventListener('click', () => { if (kalite !== 'dusuk') toggleLock(); });
document.addEventListener('pointerlockchange', () => {
  const locked = document.pointerLockElement === renderer.domElement;
  controls.enabled = !locked;
  if (locked) {
    euler.setFromQuaternion(camera.quaternion, 'YXZ');
    yaw = euler.y; pitch = euler.x;
    document.getElementById('bBakis').textContent = 'Serbest Bakış: AÇIK';
  } else {
    controls.target.copy(camera.position.clone().add(new THREE.Vector3(0, 0, -40).applyQuaternion(camera.quaternion)));
    controls.update();
    document.getElementById('bBakis').textContent = 'Serbest Bakış (F)';
  }
});
document.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement !== renderer.domElement) return;
  yaw -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-Math.PI * 0.48, Math.min(Math.PI * 0.48, pitch));
  euler.set(pitch, yaw, 0);
  camera.quaternion.setFromEuler(euler);
});

// ---------- quality / HUD ----------
function setQuality(q) {
  kalite = q;
  const low = q === 'dusuk';
  oceanUniforms.uDetail.value = low ? 0 : 1;
  bloomPass.enabled = !low;
  ssaoPass.enabled = !low;
  document.getElementById('bBloom').textContent = 'Bloom: ' + (low ? 'Kapalı' : 'Açık');
  document.getElementById('bKalite').textContent = 'Kalite: ' + (low ? 'Düşük' : 'Yüksek');
  renderer.setPixelRatio(Math.min(devicePixelRatio, low ? 1 : 1.75));
  const seg = low ? 140 : 220;
  if (seg !== oceanSeg) { oceanSeg = seg; buildOcean(seg); }
  renderer.shadowMap.enabled = !low;
  sunLight.castShadow = !low;
  composer.setSize(innerWidth, innerHeight);
  fxaaPass.material.uniforms.resolution.value.set(1 / (innerWidth * renderer.getPixelRatio()), 1 / (innerHeight * renderer.getPixelRatio()));
}
document.getElementById('bKalite').onclick = () => setQuality(kalite === 'yuksek' ? 'dusuk' : 'yuksek');
document.getElementById('bBloom').onclick = () => {
  bloomPass.enabled = !bloomPass.enabled;
  document.getElementById('bBloom').textContent = 'Bloom: ' + (bloomPass.enabled ? 'Açık' : 'Kapalı');
};
document.getElementById('bBakis').onclick = toggleLock;

// ---------- wave height mirror (JS, same formula as shader) ----------
const WAVES = [
  { dir: [0.94, 0.34], A: 1.28, L: 118.0, Q: 0.55, sp: 4.0 },
  { dir: [0.52, -0.86], A: 0.86, L: 74.0, Q: 0.62, sp: 5.2 },
  { dir: [-0.33, 0.94], A: 0.44, L: 41.0, Q: 0.72, sp: 6.6 },
  { dir: [0.88, 0.47], A: 0.26, L: 23.0, Q: 0.82, sp: 7.8 },
  { dir: [-0.74, 0.67], A: 0.15, L: 13.0, Q: 0.90, sp: 8.8 },
  { dir: [0.25, -0.97], A: 0.08, L: 7.2, Q: 1.0, sp: 9.6 }
].map(w => { const n = Math.hypot(w.dir[0], w.dir[1]); return { ...w, dir: [w.dir[0] / n, w.dir[1] / n] }; });

function dalgaYukseklik(x, z, t) {
  let y = 0;
  const detail = oceanUniforms.uDetail.value;
  for (let i = 0; i < WAVES.length; i++) {
    if (i > 2 && detail < 0.5) break;
    const w = WAVES[i];
    const k = 2 * Math.PI / w.L;
    const f = k * (w.dir[0] * x + w.dir[1] * z) - w.sp * t;
    y += w.A * Math.sin(f);
  }
  return y;
}

// ---------- loop ----------
const clock = new THREE.Clock();
let t = 0, frames = 0, fps = 0, lastFpsT = performance.now();
let msToplam = 0, msKare = 0;
let anim = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;

  // free-fly movement
  const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 90 : 28) * dt;
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
  const move = new THREE.Vector3();
  if (keys.has('KeyW') || keys.has('ArrowUp')) move.add(fwd);
  if (keys.has('KeyS') || keys.has('ArrowDown')) move.sub(fwd);
  if (keys.has('KeyD') || keys.has('ArrowRight')) move.add(right);
  if (keys.has('KeyA') || keys.has('ArrowLeft')) move.sub(right);
  if (keys.has('KeyE')) move.y += 1;
  if (keys.has('KeyQ')) move.y -= 1;
  if (move.lengthSq() > 0) {
    move.normalize().multiplyScalar(speed);
    camera.position.add(move);
    if (controls.enabled) controls.target.add(move);
  }
  if (controls.enabled) controls.update();
  if (camera.position.y < 3.6) camera.position.y = 3.6;

  // ocean + sky
  oceanUniforms.uTime.value = t;
  oceanUniforms.uCamPos.value.copy(camera.position);
  skyMat.uniforms.uTime.value = t;

  // flag flutter
  const pos = flagGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = flagBase[i * 3], y = flagBase[i * 3 + 1];
    const k = (x + 1.7) / 3.4;
    pos.array[i * 3 + 2] = Math.sin(k * 7.0 + t * 5.2) * 0.16 * k + Math.sin(y * 3.0 + t * 4.1) * 0.05 * k;
  }
  pos.needsUpdate = true;

  // curtain foam scroll (shader)
  curtainMat.uniforms.uTime.value = t;
  curtainMat.uniforms.uSurge.value = 0.5 + 0.5 * Math.sin(t * 1.35 + 0.7);

  // kaide köpük halkası + dalga çarpma patlamaları (faz bağlı)
  foamRingMat.uniforms.uTime.value = t;
  foamRingMat.uniforms.uSurge.value = 0.5 + 0.5 * Math.sin(t * 1.35);
  for (const s of splashList) {
    const px = Math.cos(s.ang) * 12.95, pz = Math.sin(s.ang) * 12.95;
    const h = dalgaYukseklik(px, pz, t);
    const hit = Math.max(0, Math.sin(t * 1.35 + s.ang * 2.0)) * Math.max(0, h + 0.5);
    s.mat.uniforms.uTime.value = t;
    s.mat.uniforms.uOp.value = Math.min(0.85, hit * 0.65);
    s.mesh.scale.set(0.7 + hit * 0.45, 0.65 + hit * 0.6, 1);
  }

  // ferries
  for (const f of ferries) {
    f.userData.x += f.userData.speed * dt;
    if (f.userData.x > 1500) f.userData.x = -1500;
    if (f.userData.x < -1500) f.userData.x = 1500;
    f.position.x = f.userData.x;
    f.position.y = Math.sin(t * 0.7 + f.position.z) * 0.18;
    f.rotation.z = Math.sin(t * 0.55 + f.position.z) * 0.012;
  }

  // gulls
  anim += dt;
  for (const g of gulls) {
    const u = g.userData;
    u.a += u.sp * dt;
    g.position.set(Math.cos(u.a) * u.r, u.h + Math.sin(t * 0.6 + u.ph) * 2.5, Math.sin(u.a) * u.r);
    g.rotation.y = -u.a + Math.PI / 2;
    const flap = Math.sin(t * 7 + u.ph) * 0.55;
    u.wl.rotation.z = flap;
    u.wr.rotation.z = -flap;
  }

  renderer.info.reset();
  const r0 = performance.now();
  composer.render();
  msToplam += performance.now() - r0;

  frames++;
  const now = performance.now();
  if (now - lastFpsT > 700) {
    fps = Math.round(frames * 1000 / (now - lastFpsT));
    msKare = +(msToplam / Math.max(1, frames)).toFixed(1);
    frames = 0; msToplam = 0; lastFpsT = now;
    document.getElementById('fps').textContent = msKare.toFixed(1).replace('.', ',') + ' ms/kare · ' +
      renderer.info.render.calls + ' çizim · ' + Math.round(renderer.info.render.triangles / 1000) + 'k üçgen';
    if (window.__sahne) { window.__sahne.fps = fps; window.__sahne.kareMs = msKare; }
  }
  if (window.__sahne) {
    window.__sahne.kare++;
    window.__sahne.cizimCagrisi = renderer.info.render.calls;
    window.__sahne.ucgen = renderer.info.render.triangles;
    window.__sahne.zaman = t;
  }
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  fxaaPass.material.uniforms.resolution.value.set(1 / (innerWidth * renderer.getPixelRatio()), 1 / (innerHeight * renderer.getPixelRatio()));
});

// ---------- test API ----------
window.__sahne = {
  hazir: false,
  kare: 0,
  fps: 0,
  kareMs: 0,
  zaman: 0,
  hatalar,
  kameraPoz: () => camera.position.toArray(),
  kameraYon: () => { const d = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); return d.toArray(); },
  kulePoz: () => { const v = new THREE.Vector3(); kule.getWorldPosition(v); return v.toArray(); },
  sahne: scene,
  kuleGrubu: kule,
  meshSay: () => { let m = 0; scene.traverse(o => { if (o.isMesh) m++; }); return m; },
  kuleMeshSay: () => { let m = 0; kule.traverse(o => { if (o.isMesh) m++; }); return m; },
  okyanus: oceanUniforms,
  dalgaYukseklik,
  dalgaZamani: () => oceanUniforms.uTime.value,
  shaderVar: () => oceanUniforms.vertexShader ? true : false,
  vertexShaderKaynak: oceanVertex,
  fragmentShaderKaynak: oceanFragment,
  kaliteAyarla: (q) => { setQuality(q); return kalite; },
  kameraAyarla: (x, y, z, tx, ty, tz) => {
    camera.position.set(x, y, z);
    controls.target.set(tx || 0, ty || 14, tz || 0);
    camera.lookAt(controls.target);
    controls.update();
    return camera.position.toArray();
  },
  renderer, kamera: camera, composer,
  olcum: () => {
    const gl = renderer.getContext();
    const t0 = performance.now();
    composer.render();
    gl.finish();
    return +(performance.now() - t0).toFixed(2);
  },
  glBilgi: () => {
    const gl = renderer.getContext();
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    return ext ? { vendor: gl.getParameter(ext.UNMASKED_VENDOR_WEBGL), renderer: gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) } : { renderer: gl.getParameter(gl.RENDERER) };
  },
  bloomAyarla: (v) => { bloomPass.enabled = !!v; return bloomPass.enabled; },
  bloomDurum: () => bloomPass.enabled,
  detay: () => oceanUniforms.uDetail.value,
  bilgi: () => ({
    kalite, fps, kareMs: msKare, cizim: renderer.info.render.calls, ucgen: renderer.info.render.triangles,
    kamera: camera.position.toArray(), kule: kule.position.toArray(),
    bloom: bloomPass.enabled, dalgaDetay: oceanUniforms.uDetail.value, zaman: t
  })
};

setQuality(kalite);
document.getElementById('yukle').classList.add('gizli');
window.__sahne.hazir = true;
animate();
</script>
</body>
</html>
